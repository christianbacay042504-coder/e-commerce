<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lumière Admin · Products Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">✦</span>
                <span class="brand-name">Lumière</span>
                <span class="brand-badge">admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H4a2 2 0 0 1-2-2z"/></svg>
                    <span>Overview</span>
                </a>
                <a href="Products-management.html" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span>Products</span>
                </a>
                <a href="Recognition-management.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>Recognition (Members)</span>
                </a>
                <a href="Recruits-management.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-4-4H11a4 4 0 0 0-4 4v2"/><circle cx="15" cy="7" r="4"/></svg>
                    <span>Recruits</span>
                </a>
                <a href="Updates-management.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
                    <span>Updates</span>
                </a>
                <a href="Product-purchase.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11H3v10h6V11z"/><path d="M21 11h-6v10h6V11z"/><path d="M15 3H9v6h6V3z"/><path d="M9 3H3v6h6V3z"/></svg>
                    <span>Purchases</span>
                </a>
                <a href="Analytics-management.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-9-9" stroke-linecap="round"/><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="2"/></svg>
                    <span>Analytics</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="admin-info">
                    <div class="admin-avatar">AD</div>
                    <div class="admin-details">
                        <span class="admin-name">Lumière Studio</span>
                        <span class="admin-role">Master Admin</span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutAdminBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Exit</span>
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-title">
                    <h1>Products Management</h1>
                    <p>Add, edit, or remove products from your Lumière catalog</p>
                </div>
                <div class="header-actions">
                    <div class="date-badge" id="liveDate"></div>
                </div>
            </header>

            <div class="tab-content active">
                <div class="tab-actions">
                    <button class="btn-primary-sm" id="addProductBtn">+ Add New Product</button>
                    <div class="search-filter">
                        <input type="text" id="adminProductSearch" placeholder="Search product..." class="search-input">
                        <select id="adminCategoryFilter" class="cat-select">
                            <option value="all">All categories</option>
                            <option value="cleanser">Cleanser</option>
                            <option value="serum">Serum</option>
                            <option value="sunscreen">Sunscreen</option>
                            <option value="moisturizer">Moisturizer</option>
                            <option value="mask">Mask</option>
                        </select>
                    </div>
                </div>
                <div class="products-admin-table" id="productsTableContainer"></div>
            </div>
        </main>
    </div>

    <!-- MODAL: Product Form -->
    <div class="modal-overlay" id="productModalForm">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 id="productFormTitle">Add Product</h3>
                <button class="modal-close-btn" id="closeProductModalBtn">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editProductId">
                <div class="form-group"><label>Product Name</label><input type="text" id="prodName" placeholder="e.g. Radiance Serum"></div>
                <div class="form-row">
                    <div class="form-group"><label>Category</label><select id="prodCategory"><option value="cleanser">Cleanser</option><option value="serum">Serum</option><option value="sunscreen">Sunscreen</option><option value="moisturizer">Moisturizer</option><option value="mask">Mask</option></select></div>
                    <div class="form-group"><label>Price (₱)</label><input type="number" id="prodPrice" placeholder="1298"></div>
                </div>
                <div class="form-group"><label>Tag / Badge</label><input type="text" id="prodTag" placeholder="Bestseller, Top Rated, New"></div>
                <div class="form-group"><label>Emoji (optional)</label><input type="text" id="prodEmoji" placeholder="✨"></div>
                <div class="form-group"><label>Description (short)</label><textarea id="prodDesc" rows="2" placeholder="Science-backed formula..."></textarea></div>
                <div class="form-group"><label>Ingredients / Key details</label><input type="text" id="prodIngredients" placeholder="Hyaluronic Acid, Vitamin C..."></div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelProductBtn">Cancel</button>
                <button class="btn-primary" id="saveProductBtn">Save Product</button>
            </div>
        </div>
    </div>

    <script>
        // PRODUCTS PAGE - Full CRUD functionality
        let adminProducts = [];

        function loadProductsData() {
            const stored = localStorage.getItem('lumiere_admin_products');
            if (stored && JSON.parse(stored).length > 0) {
                adminProducts = JSON.parse(stored);
            } else {
                seedDemoProducts();
            }
            renderProductsTable();
            updateStats();
        }

        function seedDemoProducts() {
            adminProducts = [
                { id: 1, name: "Gentle Foam Cleanser", category: "cleanser", price: 598, tag: "Bestseller", emoji: "🧴", description: "pH-balanced foaming cleanser", ingredients: "Aloe, Green Tea", rating: 4.8, reviews: 324 },
                { id: 2, name: "Radiance Vitamin C Serum", category: "serum", price: 1298, tag: "Top Rated", emoji: "✨", description: "Brightening serum", ingredients: "Vitamin C, Ferulic", rating: 4.9, reviews: 512 },
                { id: 3, name: "Hydra-Guard SPF 50+", category: "sunscreen", price: 898, tag: "Must-Have", emoji: "☀️", description: "Lightweight sunscreen", ingredients: "Zinc Oxide", rating: 4.7, reviews: 289 },
                { id: 4, name: "Peptide Renewal Moisturizer", category: "moisturizer", price: 1198, tag: "New", emoji: "💧", description: "Peptide complex", ingredients: "Matrixyl", rating: 4.6, reviews: 178 },
                { id: 5, name: "Rose Glow Essence Toner", category: "serum", price: 748, tag: "Fan Favorite", emoji: "🌹", description: "Hydrating toner", ingredients: "Rose Water, Niacinamide", rating: 4.5, reviews: 203 }
            ];
            saveProductsToLocal();
        }

        function saveProductsToLocal() {
            localStorage.setItem('lumiere_admin_products', JSON.stringify(adminProducts));
        }

        function updateStats() {
            // Update any stats on products page if needed
            const totalElem = document.getElementById('totalProductsStat');
            if (totalElem) totalElem.innerText = adminProducts.length;
        }

        function renderProductsTable() {
            const search = document.getElementById('adminProductSearch')?.value.toLowerCase() || '';
            const filterCat = document.getElementById('adminCategoryFilter')?.value || 'all';
            let filtered = adminProducts.filter(p => p.name.toLowerCase().includes(search) || (p.description || '').toLowerCase().includes(search));
            if (filterCat !== 'all') filtered = filtered.filter(p => p.category === filterCat);

            const container = document.getElementById('productsTableContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="product-row header-row">
                    <span>🖼️</span><span>Name</span><span>Category</span><span>Price</span><span>Tag</span><span>Actions</span>
                </div>
                ${filtered.map(p => `
                    <div class="product-row">
                        <span>${p.emoji || '🧴'}</span>
                        <span><strong>${escapeHtml(p.name)}</strong></span>
                        <span>${p.category}</span>
                        <span>₱${p.price.toLocaleString()}</span>
                        <span>${p.tag || '—'}</span>
                        <div class="action-btns">
                            <button class="edit-btn" data-id="${p.id}">✏️</button>
                            <button class="delete-btn" data-id="${p.id}">🗑️</button>
                        </div>
                    </div>
                `).join('')}
                ${filtered.length === 0 ? '<div style="padding:40px;text-align:center">No products found</div>' : ''}
            `;

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => openEditProduct(parseInt(btn.dataset.id)));
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteProduct(parseInt(btn.dataset.id)));
            });
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

        function openAddProduct() {
            document.getElementById('editProductId').value = '';
            document.getElementById('productFormTitle').innerText = 'Add Product';
            document.getElementById('prodName').value = '';
            document.getElementById('prodCategory').value = 'serum';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodTag').value = '';
            document.getElementById('prodEmoji').value = '';
            document.getElementById('prodDesc').value = '';
            document.getElementById('prodIngredients').value = '';
            document.getElementById('productModalForm').classList.add('open');
        }

        function openEditProduct(id) {
            const p = adminProducts.find(x => x.id === id);
            if (p) {
                document.getElementById('editProductId').value = id;
                document.getElementById('productFormTitle').innerText = 'Edit Product';
                document.getElementById('prodName').value = p.name;
                document.getElementById('prodCategory').value = p.category;
                document.getElementById('prodPrice').value = p.price;
                document.getElementById('prodTag').value = p.tag || '';
                document.getElementById('prodEmoji').value = p.emoji || '';
                document.getElementById('prodDesc').value = p.description || '';
                document.getElementById('prodIngredients').value = p.ingredients || '';
                document.getElementById('productModalForm').classList.add('open');
            }
        }

        function saveProduct() {
            const id = document.getElementById('editProductId').value;
            const name = document.getElementById('prodName').value.trim();
            if (!name) return alert('Product name required');
            const newProd = {
                id: id ? parseInt(id) : Date.now(),
                name: name,
                category: document.getElementById('prodCategory').value,
                price: parseInt(document.getElementById('prodPrice').value) || 0,
                tag: document.getElementById('prodTag').value,
                emoji: document.getElementById('prodEmoji').value,
                description: document.getElementById('prodDesc').value,
                ingredients: document.getElementById('prodIngredients').value,
                rating: 4.5,
                reviews: 0
            };
            if (id) {
                const idx = adminProducts.findIndex(p => p.id == id);
                if (idx !== -1) adminProducts[idx] = newProd;
            } else {
                adminProducts.push(newProd);
            }
            saveProductsToLocal();
            renderProductsTable();
            closeProductForm();
            // Trigger storage event for other tabs
            window.dispatchEvent(new StorageEvent('storage', { key: 'lumiere_admin_products', newValue: JSON.stringify(adminProducts) }));
        }

        function deleteProduct(id) {
            if (confirm('Delete product permanently?')) {
                adminProducts = adminProducts.filter(p => p.id !== id);
                saveProductsToLocal();
                renderProductsTable();
                window.dispatchEvent(new StorageEvent('storage', { key: 'lumiere_admin_products', newValue: JSON.stringify(adminProducts) }));
            }
        }

        function closeProductForm() {
            document.getElementById('productModalForm').classList.remove('open');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('liveDate').innerText = new Date().toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
            loadProductsData();

            document.getElementById('addProductBtn')?.addEventListener('click', openAddProduct);
            document.getElementById('saveProductBtn')?.addEventListener('click', saveProduct);
            document.getElementById('closeProductModalBtn')?.addEventListener('click', closeProductForm);
            document.getElementById('cancelProductBtn')?.addEventListener('click', closeProductForm);
            document.getElementById('adminProductSearch')?.addEventListener('input', () => renderProductsTable());
            document.getElementById('adminCategoryFilter')?.addEventListener('change', () => renderProductsTable());
            document.getElementById('logoutAdminBtn')?.addEventListener('click', () => { window.location.href = '../index.html'; });

            window.addEventListener('storage', (e) => {
                if (e.key === 'lumiere_admin_products' && e.newValue) {
                    adminProducts = JSON.parse(e.newValue);
                    renderProductsTable();
                }
            });
        });
    </script>
</body>
</html>
