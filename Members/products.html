<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Products - Skin Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Member Products Specific Styles */
        :root {
            --admin-bg: #f8f5f2;
            --admin-sidebar: #1e1816;
            --admin-card: #ffffff;
            --gold: #c9a96e;
            --rose-dark: #c49080;
            --text-dark: #2c2420;
            --text-mid: #6b5a52;
            --text-light: #a08c84;
            --border: #e6ddd6;
            --shadow-sm: 0 4px 12px rgba(44, 36, 32, 0.06);
            --shadow-md: 0 8px 24px rgba(44, 36, 32, 0.08);
            --transition: 0.2s ease;
        }

        .member-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* ---------- MEMBER SIDEBAR ---------- */
        .member-sidebar {
            width: 280px;
            background: var(--admin-sidebar);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            transition: all 0.3s;
            z-index: 100;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-brand {
            padding: 32px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 28px;
        }

        .brand-icon {
            font-size: 28px;
            color: var(--gold);
        }

        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 500;
            color: white;
            letter-spacing: 1px;
        }

        .brand-badge {
            background: rgba(201, 169, 110, 0.2);
            color: var(--gold);
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 40px;
            margin-left: 6px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .sidebar-nav {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: transparent;
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: left;
            text-decoration: none;
        }

        .nav-item svg {
            flex-shrink: 0;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: white;
        }

        .nav-item.active {
            background: rgba(201, 169, 110, 0.18);
            color: var(--gold);
            border-left: 3px solid var(--gold);
        }

        .sidebar-footer {
            padding: 24px 20px 32px;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: auto;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .member-avatar {
            width: 42px;
            height: 42px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .member-details {
            flex: 1;
        }

        .member-name {
            display: block;
            color: white;
            font-weight: 500;
            font-size: 14px;
        }

        .member-role {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            margin-top: 2px;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.2);
            border-color: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }

        /* ---------- MAIN CONTENT ---------- */
        .member-main {
            flex: 1;
            background: var(--admin-bg);
            overflow-x: hidden;
        }

        .products-page {
            min-height: 100vh;
            background: var(--admin-bg);
            padding: 20px 0;
        }

        .products-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .products-header {
            background: var(--admin-card);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .welcome-section h1 {
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .welcome-section p {
            color: var(--text-mid);
            font-size: 1.1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--rose-dark);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 500;
        }

        /* Products Section */
        .products-section {
            background: var(--admin-card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-sm);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--text-dark);
        }

        .products-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 16px;
            border: 2px solid var(--border);
            border-radius: 25px;
            font-size: 14px;
            background: var(--admin-bg);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--gold);
            background: white;
        }

        .search-box svg {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-mid);
        }

        .filter-dropdown {
            position: relative;
        }

        .filter-btn {
            background: transparent;
            border: 2px solid var(--border);
            padding: 12px 20px;
            border-radius: 25px;
            color: var(--text-mid);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            border-color: var(--gold);
            color: var(--text-dark);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .product-card {
            background: var(--admin-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--gold);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f8f5f2 0%, #e6ddd6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .product-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--rose-dark);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .product-description {
            color: var(--text-mid);
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .product-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .price-current {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--rose-dark);
        }

        .price-original {
            font-size: 1rem;
            color: var(--text-light);
            text-decoration: line-through;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn-add-cart {
            flex: 1;
            background: var(--rose-dark);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 25px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add-cart:hover {
            background: var(--gold);
            transform: translateY(-1px);
        }

        .btn-wishlist {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-mid);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-wishlist:hover {
            border-color: var(--rose-dark);
            color: var(--rose-dark);
        }

        .btn-wishlist.active {
            background: var(--rose-dark);
            border-color: var(--rose-dark);
            color: white;
        }

        @media (max-width: 768px) {
            .member-sidebar {
                position: fixed;
                left: -280px;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease;
            }

            .member-sidebar.open {
                left: 0;
            }

            .member-main {
                margin-left: 0;
            }

            .products-header {
                flex-direction: column;
                text-align: center;
            }

            .header-actions {
                flex-direction: column;
                gap: 15px;
                width: 100%;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .products-controls {
                width: 100%;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
        }
    </style>
</head>

    <script>
        // Load user data
        function loadUserData() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            const userName = document.getElementById('userName');
            const sidebarName = document.getElementById('sidebarName');
            const sidebarAvatar = document.getElementById('sidebarAvatar');
            
            if (currentUser.name) {
                userName.textContent = currentUser.name;
                sidebarName.textContent = currentUser.name;
                
                // Create initials for avatar
                const names = currentUser.name.split(' ');
                const initials = names.map(n => n[0]).join('').substring(0, 2).toUpperCase();
                sidebarAvatar.textContent = initials;
            } else {
                userName.textContent = 'Guest Member';
                sidebarName.textContent = 'Guest Member';
                sidebarAvatar.textContent = 'GM';
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            showToast('Logged out successfully. Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = '../Login/login.html';
            }, 2000);
        }

        function addToCart(productName, price) {
            // Get existing cart or create new one
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            // Check if product already in cart
            const existingItem = cart.find(item => item.name === productName);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    name: productName,
                    price: price,
                    quantity: 1
                });
            }
            
            // Save cart
            localStorage.setItem('cart', JSON.stringify(cart));
            showToast(`${productName} added to cart!`, 'success');
        }

        function toggleWishlist(button) {
            button.classList.toggle('active');
            const isActive = button.classList.contains('active');
            const productName = button.closest('.product-card').querySelector('.product-name').textContent;
            
            if (isActive) {
                showToast(`${productName} added to wishlist!`, 'success');
            } else {
                showToast(`${productName} removed from wishlist!`, 'info');
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const productCards = document.querySelectorAll('.product-card');
            
            productCards.forEach(card => {
                const productName = card.querySelector('.product-name').textContent.toLowerCase();
                const productDescription = card.querySelector('.product-description').textContent.toLowerCase();
                
                if (productName.includes(searchTerm) || productDescription.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 10px;
                color: white;
                font-weight: 500;
                z-index: 10000;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            `;
            
            if (type === 'success') {
                toast.style.background = '#28a745';
            } else if (type === 'error') {
                toast.style.background = '#dc3545';
            } else {
                toast.style.background = '#17a2b8';
            }
            
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(0)';
            }, 100);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            loadProductsData();
        });

        // Function to load products data from external source
        function loadProductsData() {
            // This function will be called to populate products data
            // You can connect this to an API, database, or external file
            console.log('Products data loading - connect to external data source');
            
            // Example structure for loading products:
            // loadProducts();
        }

        // Function to populate products grid
        function populateProducts(products) {
            const productsGrid = document.getElementById('productsGrid');
            productsGrid.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">
                        ${product.emoji || '🧴'}
                        ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-description">${product.description}</p>
                        <div class="product-price">
                            <span class="price-current">$${product.price}</span>
                            ${product.originalPrice ? `<span class="price-original">$${product.originalPrice}</span>` : ''}
                        </div>
                        <div class="product-actions">
                            <button class="btn-add-cart" onclick="addToCart('${product.name}', ${product.price})">Add to Cart</button>
                            <button class="btn-wishlist" onclick="toggleWishlist(this)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
                productsGrid.appendChild(card);
            });
        }

            },
            // ... more products

        */
    </script>
