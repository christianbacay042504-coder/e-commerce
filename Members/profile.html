<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Skin Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Member Profile Specific Styles */
        :root {
            --admin-bg: #f8f5f2;
            --admin-sidebar: #1e1816;
            --admin-card: #ffffff;
            --gold: #c9a96e;
            --rose-dark: #c49080;
            --text-dark: #2c2420;
            --text-mid: #6b5a52;
            --text-light: #a08c84;
            --border: #e6ddd6;
            --shadow-sm: 0 4px 12px rgba(44, 36, 32, 0.06);
            --shadow-md: 0 8px 24px rgba(44, 36, 32, 0.08);
            --transition: 0.2s ease;
        }

        .member-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* ---------- MEMBER SIDEBAR ---------- */
        .member-sidebar {
            width: 280px;
            background: var(--admin-sidebar);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            transition: all 0.3s;
            z-index: 100;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-brand {
            padding: 32px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 28px;
        }

        .brand-icon {
            font-size: 28px;
            color: var(--gold);
        }

        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 500;
            color: white;
            letter-spacing: 1px;
        }

        .brand-badge {
            background: rgba(201, 169, 110, 0.2);
            color: var(--gold);
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 40px;
            margin-left: 6px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .sidebar-nav {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: transparent;
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: left;
            text-decoration: none;
        }

        .nav-item svg {
            flex-shrink: 0;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: white;
        }

        .nav-item.active {
            background: rgba(201, 169, 110, 0.18);
            color: var(--gold);
            border-left: 3px solid var(--gold);
        }

        .sidebar-footer {
            padding: 24px 20px 32px;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: auto;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .member-avatar {
            width: 42px;
            height: 42px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .member-details {
            flex: 1;
        }

        .member-name {
            display: block;
            color: white;
            font-weight: 500;
            font-size: 14px;
        }

        .member-role {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            margin-top: 2px;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.2);
            border-color: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }

        /* ---------- MAIN CONTENT ---------- */
        .member-main {
            flex: 1;
            background: var(--admin-bg);
            overflow-x: hidden;
        }

        .profile-page {
            min-height: 100vh;
            background: var(--admin-bg);
            padding: 20px 0;
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .profile-header {
            background: var(--admin-card);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .welcome-section h1 {
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .welcome-section p {
            color: var(--text-mid);
            font-size: 1.1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--rose-dark);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 500;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .profile-card {
            background: var(--admin-card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-sm);
        }

        .profile-form .form-group {
            margin-bottom: 25px;
        }

        .profile-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .profile-form input,
        .profile-form select,
        .profile-form textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: var(--admin-bg);
        }

        .profile-form input:focus,
        .profile-form select:focus,
        .profile-form textarea:focus {
            outline: none;
            border-color: var(--gold);
            background: white;
        }

        .profile-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-primary {
            background: var(--rose-dark);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .btn-primary:hover {
            background: var(--gold);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--rose-dark);
            border: 2px solid var(--rose-dark);
            padding: 14px 28px;
            border-radius: 25px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .btn-secondary:hover {
            background: var(--rose-dark);
            color: white;
        }

        @media (max-width: 768px) {
            .member-sidebar {
                position: fixed;
                left: -280px;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease;
            }

            .member-sidebar.open {
                left: 0;
            }

            .member-main {
                margin-left: 0;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .header-actions {
                flex-direction: column;
                gap: 15px;
                width: 100%;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="member-wrapper">
        <!-- MEMBER SIDEBAR -->
        <aside class="member-sidebar" id="memberSidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">✦</span>
                <span class="brand-name">Skin Care</span>
                <span class="brand-badge">member</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H4a2 2 0 0 1-2-2z"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <path d="M16 10a4 4 0 0 1-8 0"/>
                    </svg>
                    <span>Shop Products</span>
                </a>
                <a href="orders.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span>My Orders</span>
                </a>
                <a href="profile.html" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>Profile</span>
                </a>
                <a href="recruits.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 00-4-4H11a4 4 0 00-4 4v2"/>
                        <circle cx="15" cy="7" r="4"/>
                    </svg>
                    <span>My Recruits</span>
                </a>
                <a href="rewards.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <span>Rewards</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="member-info">
                    <div class="member-avatar" id="sidebarAvatar">JD</div>
                    <div class="member-details">
                        <span class="member-name" id="sidebarName">John Doe</span>
                        <span class="member-role">Premium Member</span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutMemberBtn" onclick="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="member-main">
            <!-- Profile Page -->
            <section class="profile-page">
                <div class="profile-container">
                    <!-- Profile Header -->
                    <div class="profile-header">
                        <div class="welcome-section">
                            <h1>My Profile</h1>
                            <p>Manage your personal information and preferences</p>
                        </div>
                        <div class="header-actions">
                            <div class="user-info">
                                <div class="user-avatar">👤</div>
                                <div>
                                    <div id="userName">Loading...</div>
                                    <div style="font-size: 0.85rem; opacity: 0.9;">Member</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Content -->
                    <div class="profile-grid">
                        <!-- Personal Information -->
                        <div class="profile-card">
                            <h2 style="margin-bottom: 25px; color: var(--text-dark);">Personal Information</h2>
                            <form class="profile-form">
                                <div class="form-group">
                                    <label for="firstName">First Name</label>
                                    <input type="text" id="firstName" value="John">
                                </div>
                                <div class="form-group">
                                    <label for="lastName">Last Name</label>
                                    <input type="text" id="lastName" value="Doe">
                                </div>
                                <div class="form-group">
                                    <label for="email">Email Address</label>
                                    <input type="email" id="email" value="member@skincare.com">
                                </div>
                                <div class="form-group">
                                    <label for="phone">Phone Number</label>
                                    <input type="tel" id="phone" value="+1234567890">
                                </div>
                                <div class="form-group">
                                    <label for="birthday">Birthday</label>
                                    <input type="date" id="birthday" value="1990-01-01">
                                </div>
                                <button type="submit" class="btn-primary">Save Changes</button>
                            </form>
                        </div>

                        <!-- Additional Information -->
                        <div class="profile-card">
                            <h2 style="margin-bottom: 25px; color: var(--text-dark);">Additional Information</h2>
                            <form class="profile-form">
                                <div class="form-group">
                                    <label for="skinType">Skin Type</label>
                                    <select id="skinType">
                                        <option value="normal">Normal</option>
                                        <option value="dry">Dry</option>
                                        <option value="oily">Oily</option>
                                        <option value="combination">Combination</option>
                                        <option value="sensitive">Sensitive</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="skinConcerns">Skin Concerns</label>
                                    <textarea id="skinConcerns" placeholder="Tell us about your skin concerns...">Acne, Dryness</textarea>
                                </div>
                                <div class="form-group">
                                    <label for="address">Shipping Address</label>
                                    <input type="text" id="address" value="123 Main St, City, State 12345">
                                </div>
                                <div class="form-group">
                                    <label for="preferences">Product Preferences</label>
                                    <textarea id="preferences" placeholder="Any product preferences or allergies...">Prefer organic products, allergic to fragrances</textarea>
                                </div>
                                <div style="display: flex; gap: 15px;">
                                    <button type="submit" class="btn-primary">Update Profile</button>
                                    <button type="button" class="btn-secondary" onclick="resetForm()">Reset</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Load user data
        function loadUserData() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            const userName = document.getElementById('userName');
            const sidebarName = document.getElementById('sidebarName');
            const sidebarAvatar = document.getElementById('sidebarAvatar');
            
            if (currentUser.name) {
                userName.textContent = currentUser.name;
                sidebarName.textContent = currentUser.name;
                
                // Create initials for avatar
                const names = currentUser.name.split(' ');
                const initials = names.map(n => n[0]).join('').substring(0, 2).toUpperCase();
                sidebarAvatar.textContent = initials;
            } else {
                userName.textContent = 'Guest Member';
                sidebarName.textContent = 'Guest Member';
                sidebarAvatar.textContent = 'GM';
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            showToast('Logged out successfully. Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = '../Login/login.html';
            }, 2000);
        }

        function resetForm() {
            if (confirm('Are you sure you want to reset all form fields?')) {
                document.querySelectorAll('.profile-form').forEach(form => form.reset());
                showToast('Form has been reset', 'info');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 10px;
                color: white;
                font-weight: 500;
                z-index: 10000;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            `;
            
            if (type === 'success') {
                toast.style.background = '#28a745';
            } else if (type === 'error') {
                toast.style.background = '#dc3545';
            } else {
                toast.style.background = '#17a2b8';
            }
            
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(0)';
            }, 100);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // Handle form submissions
        document.querySelectorAll('.profile-form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                showToast('Profile updated successfully!', 'success');
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', loadUserData);
    </script>
</body>
</html>
